name: ai_photo_editor
description: AI-powered photo editing app using TensorFlow Lite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # TensorFlow Lite
  tflite_flutter: ^0.10.4
  tflite_flutter_helper: ^0.3.1

  # Image Processing
  image: ^4.1.3
  image_picker: ^1.0.5
  image_gallery_saver: ^2.0.3
  photo_view: ^0.14.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # UI
  flutter_colorpicker: ^1.0.3
  flutter_speed_dial: ^7.0.0

  # Utils
  path_provider: ^2.1.1
  get_it: ^7.6.4
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/styles/
